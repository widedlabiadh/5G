security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            # ⬇️ AJOUTEZ CETTE LIGNE ⬇️
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                # ⬇️ OPTIONNEL : Personnaliser le message d'erreur ⬇️
                failure_path: app_login
                failure_forward: false
            logout:
                path: app_logout
                target: app_login

    # ⬇️ HIÉRARCHIE DES RÔLES ⬇️
    role_hierarchy:
        ROLE_SUPERUSER: [ROLE_ADMIN, ROLE_ALLOWED_TO_SWITCH]
        ROLE_ADMIN: [ROLE_CONTROLEUR, ROLE_SUPPORT_FO, ROLE_SUPPORT_FH, ROLE_INGENIERIE_FH, ROLE_INGENIERIE_IP, ROLE_GC, ROLE_DEPLOIEMENT]
        ROLE_CONTROLEUR: [ROLE_USER]
        ROLE_SUPPORT_FO: [ROLE_USER]
        ROLE_SUPPORT_FH: [ROLE_USER]
        ROLE_INGENIERIE_FH: [ROLE_USER]
        ROLE_INGENIERIE_IP: [ROLE_USER]
        ROLE_GC: [ROLE_USER]
        ROLE_DEPLOIEMENT: [ROLE_USER]

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        
        # Routes Admin (réservées aux administrateurs)
        - { path: ^/admin/users/delete, roles: ROLE_ADMIN }
        - { path: ^/admin/users/new, roles: ROLE_ADMIN }
        - { path: ^/admin/users/edit, roles: ROLE_ADMIN }
        - { path: ^/admin/users, roles: ROLE_ADMIN }
        - { path: ^/admin/dashboard, roles: ROLE_ADMIN }
        - { path: ^/admin/settings, roles: ROLE_ADMIN }
        
        # Routes Contrôleur (lecture seule)
        - { path: ^/controleur, roles: ROLE_CONTROLEUR }
        
        # Routes Superuser
        - { path: ^/superuser, roles: ROLE_SUPERUSER }
        
        # Routes Checklist (tous les utilisateurs connectés)
        - { path: ^/checklist, roles: IS_AUTHENTICATED_FULLY }
        
        # Routes Dashboard (tous les utilisateurs connectés)
        - { path: ^/dashboard, roles: IS_AUTHENTICATED_FULLY }
        
        # Route par défaut - nécessite authentification
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }